<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>하이닉스 주별 예상 주가</title>
<style>
  :root{
    --bg:#0e1116;--panel:#161b22;--panel-2:#1c2330;--line:#2a3140;
    --text:#e6edf3;--muted:#9aa7b6;--accent:#4f9dff;--up:#ff5b5b;--down:#4f9dff;--gold:#ffcf5c;--green:#3fd07a;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","맑은 고딕",Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:18px 13px 60px}
  h1{margin:0 0 3px;font-size:20px}
  .lead{color:var(--muted);font-size:13px;margin:0 0 4px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:14px}
  .panel h2{margin:0 0 12px;font-size:15px;font-weight:700}
  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  @media(max-width:430px){.cards{grid-template-columns:1fr 1fr}}
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:11px}
  .card .k{font-size:11px;color:var(--muted)}
  .card .v{font-size:17px;font-weight:800;margin-top:4px}
  .up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.green{color:var(--green)}.gold{color:var(--gold)}
  canvas{width:100%;max-width:100%;height:250px;display:block;touch-action:pan-y}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:12px}
  td:first-child,th:first-child{text-align:left}
  tr.ev td{background:rgba(255,207,92,.09)}
  .evname{font-size:11px;color:var(--gold);display:block}
  .twrap{max-height:360px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
  .tip{font-size:12px;color:var(--muted);margin-top:9px}
  .concl{background:linear-gradient(180deg,#14261c,#111a15);border:1px solid #23402e;border-radius:12px;padding:15px;font-size:14px;line-height:1.85}
  .concl b{color:var(--green)}
  .concl .big{font-size:15px;font-weight:800;margin-bottom:8px;color:var(--text)}
  .in{display:flex;gap:9px;align-items:center;margin-top:4px}
  .in label{font-size:12px;color:var(--muted)}
  .in input{width:130px;padding:8px 10px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-size:15px;text-align:right;outline:none}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:2px}
  .seg button{background:none;border:none;color:var(--muted);padding:8px 12px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#06101f;font-weight:700}
  .foot{margin-top:20px;color:var(--muted);font-size:11px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>SK하이닉스 주별 예상 주가</h1>
  <p class="lead">평단 226만원 · 42주 보유 기준 · 증권가 강세 전망을 반영한 예상</p>

  <section class="panel">
    <h2>지금 내 상태</h2>
    <div class="cards" id="now"></div>
    <div class="in"><label>현재가</label><input id="cur" type="number" value="2425000" step="1000"/><span class="muted" style="font-size:12px">원 (바뀌면 여기만 수정)</span></div>
    <div class="in" style="margin-top:10px"><label>전망</label>
      <span class="seg" id="seg">
        <button data-m="0.05">신중</button>
        <button data-m="0.15" class="on">증권가 기본</button>
        <button data-m="0.30">강세</button>
      </span>
    </div>
  </section>

  <section class="panel">
    <h2>예상 주가 흐름</h2>
    <canvas id="chart" width="660" height="250"></canvas>
    <p class="tip">빨간선 = 예상 주가 · 노란 점선 = 내 평단 · 옅은 영역 = 오르내릴 수 있는 범위</p>
  </section>

  <section class="panel">
    <h2>주별 예상 주가 & 지금 팔면 내 손익</h2>
    <div class="twrap">
      <table id="weekly"><thead><tr><th>날짜</th><th>예상 주가</th><th>팔면 내 손익</th></tr></thead><tbody></tbody></table>
    </div>
    <p class="tip">노란 줄 = 실적·이벤트가 있는 주</p>
  </section>

  <section class="panel">
    <h2>이 가격에 팔면?</h2>
    <table id="targets"><thead><tr><th>매도가</th><th>내 돈 대비</th><th>팔면 내 손익(세후)</th></tr></thead><tbody></tbody></table>
  </section>

  <section class="panel">
    <h2>결론 — 언제 팔까</h2>
    <div class="concl" id="concl"></div>
  </section>

  <p class="foot">예상은 가정에 기반한 참고용이며 실제 주가·수익을 보장하지 않습니다.</p>
</div>

<script>
const $=(id)=>document.getElementById(id);
const AVG=2264880, QTY=42;
const man=(n)=>Math.round(n/10000).toLocaleString("ko-KR")+"만원";
const plMan=(n)=>(n>=0?"+":"−")+Math.abs(Math.round(n/10000)).toLocaleString("ko-KR")+"만원";
const pctv=(n)=>(n>=0?"+":"")+Math.round(n)+"%";
const cls=(n)=>n>0?"up":n<0?"down":"muted";

// 이벤트: 시작 기준 주차, 이름, 기대 상승효과(%)
const START=new Date("2026-07-05");
const EVENTS=[
  {d:"2026-07-07",n:"삼성 실적",j:1.6},
  {d:"2026-07-10",n:"나스닥 상장",j:2.4},
  {d:"2026-07-23",n:"2분기 실적",j:2.8},
  {d:"2026-09-30",n:"엔비디아·업황",j:5.4},
  {d:"2026-10-28",n:"3분기 실적",j:4.4},
  {d:"2026-12-31",n:"연말·HBM4",j:4.2},
  {d:"2027-06-30",n:"슈퍼사이클",j:4.9},
];
const WEEKS=52;
const wIndex=(iso)=>Math.round((new Date(iso)-START)/(7*864e5));
const wDate=(w)=>{const dt=new Date(START);dt.setDate(dt.getDate()+w*7);return dt;};
const fmtD=(dt)=>`${dt.getFullYear()%100}.${dt.getMonth()+1}.${dt.getDate()}`;

let baseMu=0.15;

function buildPath(cur){
  const evByWeek={};EVENTS.forEach(e=>{const w=wIndex(e.d);if(w>=0&&w<=WEEKS)evByWeek[w]=e;});
  const g=baseMu/52;
  const path=[cur];let p=cur;
  for(let w=1;w<=WEEKS;w++){
    p*=(1+g);
    if(evByWeek[w]) p*=(1+evByWeek[w].j/100);
    path.push(p);
  }
  return {path,evByWeek};
}

function renderNow(cur){
  const pl=(cur-AVG)*QTY, rate=(cur/AVG-1)*100;
  $("now").innerHTML=[
    {k:"평단(1주)",v:man(AVG)},
    {k:"현재가",v:man(cur)},
    {k:"지금 손익",v:plMan(pl),c:cls(pl)},
  ].map(c=>`<div class="card"><div class="k">${c.k}</div><div class="v ${c.c||""}">${c.v}</div></div>`).join("");
}

function renderWeekly(path,evByWeek){
  let rows="";
  for(let w=1;w<=WEEKS;w++){
    const price=path[w], pl=(price-AVG)*QTY, ev=evByWeek[w];
    rows+=`<tr class="${ev?"ev":""}"><td>${fmtD(wDate(w))}${ev?`<span class="evname">${ev.n}</span>`:""}</td>
      <td>${man(price)}</td><td class="${cls(pl)}">${plMan(pl)}</td></tr>`;
  }
  $("weekly").querySelector("tbody").innerHTML=rows;
}

function renderTargets(cur){
  const fee=0.00165; // 세금+수수료 대략
  const rows=[
    {n:"본전(평단)",p:AVG},
    {n:"현재가",p:cur},
    {n:"300만원",p:3000000},
    {n:"350만원",p:3500000},
    {n:"400만원(목표가)",p:4000000},
  ];
  $("targets").querySelector("tbody").innerHTML=rows.map(r=>{
    const net=(r.p*(1-fee)-AVG)*QTY, d=(r.p/AVG-1)*100;
    return `<tr><td>${man(r.p)} <span class="muted" style="font-size:11px">${r.n}</span></td>
      <td class="${cls(d)}">${pctv(d)}</td><td class="${cls(net)}">${plMan(net)}</td></tr>`;
  }).join("");
}

function drawChart(path,evByWeek,cur){
  const cv=$("chart"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
  const padL=46,padR=12,padT=14,padB=26,x0=padL,x1=W-padR,y0=H-padB,y1=padT;
  // 범위(불확실성): ±주차에 따라 커지는 폭 (시각용)
  const up=path.map((p,w)=>p*(1+0.02*Math.sqrt(w)));
  const dn=path.map((p,w)=>p*(1-0.02*Math.sqrt(w)));
  const lo=Math.min(...dn,AVG)*0.99, hi=Math.max(...up,AVG)*1.01;
  const sx=(w)=>x0+(w/WEEKS)*(x1-x0), sy=(v)=>y0-((v-lo)/(hi-lo))*(y0-y1);
  ctx.strokeStyle="#2a3140";ctx.fillStyle="#9aa7b6";ctx.font="10px sans-serif";
  for(let g=0;g<=3;g++){const v=lo+(hi-lo)*g/3,y=sy(v);ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
    ctx.textAlign="right";ctx.fillText(Math.round(v/10000)+"만",x0-5,y+3);}
  // band
  ctx.fillStyle="rgba(79,157,255,.13)";ctx.beginPath();
  up.forEach((v,w)=>{const x=sx(w),y=sy(v);w?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  for(let w=WEEKS;w>=0;w--)ctx.lineTo(sx(w),sy(dn[w]));ctx.closePath();ctx.fill();
  // 평단선
  ctx.strokeStyle="#ffcf5c";ctx.setLineDash([5,4]);const ya=sy(AVG);
  ctx.beginPath();ctx.moveTo(x0,ya);ctx.lineTo(x1,ya);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="#ffcf5c";ctx.textAlign="left";ctx.fillText("평단",x0+2,ya-3);
  // 예상선
  ctx.strokeStyle="#ff5b5b";ctx.lineWidth=2.4;ctx.beginPath();
  path.forEach((v,w)=>{const x=sx(w),y=sy(v);w?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
  // 이벤트 점
  ctx.fillStyle="#ffcf5c";Object.keys(evByWeek).forEach(w=>{w=+w;ctx.beginPath();ctx.arc(sx(w),sy(path[w]),3,0,7);ctx.fill();});
  // x축
  ctx.fillStyle="#9aa7b6";ctx.textAlign="center";ctx.font="9px sans-serif";
  [0,13,26,39,52].forEach(w=>{ctx.fillText(fmtD(wDate(w)),sx(w),y0+15);});
}

function renderConcl(cur,path){
  const end=path[WEEKS];
  $("concl").innerHTML=`
    <div class="big">지금 당장 팔 필요는 없습니다.</div>
    <b>1) 하반기까지 보유</b> — 7월·10월 실적과 HBM4 양산이 줄줄이 있어, 지금 파는 건 이릅니다.<br>
    <b>2) 300만원부터 나눠서 익절</b> — 주가가 <b>약 300만원(내 돈 +32%)</b>에 닿으면 <b>절반</b> 팔아 이익을 확보하세요. 42주 중 21주만 팔아도 세후 약 ${plMan((3000000*0.99835-AVG)*21)} 실현.<br>
    <b>3) 나머지는 목표 350만~400만원</b> — 남은 물량은 예상 흐름상 <b>2027년 상반기 ${man(end)} 부근</b>을 목표로 들고 가되, <b>고점에서 15% 넘게 빠지면 파세요</b>(하락 방어).<br>
    <span class="muted" style="font-size:12.5px">요약: 지금 홀드 → 300만원 절반 익절 → 나머지 350~400만원 목표, 급락 시 정리.</span>
  `;
}

function update(){
  const cur=+$("cur").value||0;
  const {path,evByWeek}=buildPath(cur);
  renderNow(cur);renderWeekly(path,evByWeek);renderTargets(cur);drawChart(path,evByWeek,cur);renderConcl(cur,path);
}
$("cur").addEventListener("input",update);
$("seg").addEventListener("click",(e)=>{const b=e.target.closest("button");if(!b)return;
  baseMu=+b.dataset.m;[...$("seg").children].forEach(x=>x.classList.remove("on"));b.classList.add("on");update();});
update();
</script>
</body>
</html>
